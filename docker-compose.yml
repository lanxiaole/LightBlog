
services:
  mysql:
    image: mysql:8.0
    container_name: lightblog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-lightblog123}
      MYSQL_DATABASE: ${DB_NAME:-lightblog}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3307:3306"
    networks:
      - lightblog-network

  server:
    build:
      context: .
      dockerfile: ./docker/server/Dockerfile
    container_name: lightblog-server
    restart: always
    depends_on:
      - mysql
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-lightblog123}
      DB_NAME: ${DB_NAME:-lightblog}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key}
      OSS_REGION: ${OSS_REGION:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
    ports:
      - "3000:3000"
    networks:
      - lightblog-network

  client:
    build:
      context: .
      dockerfile: ./docker/client/Dockerfile
    container_name: lightblog-client
    restart: always
    depends_on:
      - server
    ports:
      - "8080:80"
    networks:
      - lightblog-network

volumes:
  mysql-data:
    driver: local

networks:
  lightblog-network:
    driver: bridge

